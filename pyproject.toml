[project]
name = "code_review_agent"
version = "2.0.0"
description = "Production-grade multi-agent code review system powered by CrewAI Flows, Google Gemini, SAST, and GitHub Webhooks"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.0,<2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "dill>=0.3.7",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "unidiff>=0.7.5",
    "ruff>=0.3.0",
    "bandit>=1.7.8",
    "mcp>=1.0.0"
]

[project.optional-dependencies]
eval = [
    "deepeval>=1.5.0",
    "langfuse>=2.50.0",
    "jsonschema>=4.20.0"
]

[project.scripts]
code-review-agent = "code_review_agent.main:cli_main"
kickoff = "code_review_agent.main:kickoff"
plot = "code_review_agent.main:plot"
review-server = "code_review_agent.webhook_server:start_server"
eval-benchmarks = "code_review_agent.benchmarks:main"
code-review-mcp = "code_review_agent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Default run excludes `slow` — see markers below and the Testing section in README.md.
addopts = "-m \"not slow\""
markers = [
    "eval: AI evaluation tests requiring LLM-as-a-judge",
    "deterministic_eval: Fast, zero-cost deterministic evaluation tests",
    "slow: spawns a real OS subprocess (bandit/ruff CLI, nested pytest run) or constructs a real CrewAI Agent (LLMFactory). Timing is host-load sensitive. Run explicitly with `pytest -m slow tests/`."
]
