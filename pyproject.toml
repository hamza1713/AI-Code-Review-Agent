[project]
name = "code_review_agent"
version = "2.0.0"
description = "Production-grade multi-agent code review system powered by CrewAI Flows, Google Gemini, SAST, and GitHub Webhooks"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.100.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "dill>=0.3.7",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "unidiff>=0.7.5",
    "ruff>=0.3.0",
    "tree-sitter>=0.21.0",
    "bandit>=1.7.8"
]

[project.scripts]
code-review-agent = "code_review_agent.main:cli_main"
kickoff = "code_review_agent.main:kickoff"
plot = "code_review_agent.main:plot"
review-server = "code_review_agent.webhook_server:start_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
