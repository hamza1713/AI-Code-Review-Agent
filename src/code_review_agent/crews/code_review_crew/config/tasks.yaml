analyze_code_quality:
  name: Analyze Code Quality
  agent: senior_developer
  description: >
    1. Perform a thorough architectural and quality review of the pull request changes.
    2. Examine potential ripple effects using the repository call graph: \n{code_graph_context}
    3. Identify code smells, anti-patterns, maintainability issues, or missing edge case handling.
    4. Categorize each identified item into 'critical_issues' (blocking defects) or 'minor_issues' (suggestions).
    5. Formulate 'cross_file_risks' and 'inline_suggestions' with exact file path, line number, and replacement suggestion code.
    PR content: \n{file_content}
  expected_output: >
    A JSON object containing:
    - 'critical_issues': An array of strings describing mandatory fixes.
    - 'minor_issues': An array of strings describing optional quality improvements.
    - 'reasoning': A detailed explanation of your architectural and quality decisions.
    - 'cross_file_risks': An array of strings describing potential ripple effects in caller files.
    - 'inline_suggestions': An array of objects with 'path', 'line', 'severity', 'comment_body', and optional 'suggestion_code'.

review_security:
  name: Review Security
  agent: security_engineer
  description: >
    1. Inspect the pull request diff and security pattern scanner output for security vulnerabilities (e.g. OWASP Top 10, SQL injection, authentication bypasses, sensitive data exposure, plaintext credentials, command injection).
    Before documenting vulnerabilities: if the Security Pattern Findings ({sast_context}) contain multiple entries pointing to the same file, line range, and root cause (e.g. a heuristic hit and a Bandit rule for the same issue), merge them into a single entry in 'security_vulnerabilities'. List every rule ID that contributed under a new 'matched_by' field rather than creating duplicate entries.
    2. Document each vulnerability with description, assessed risk level ('low', 'medium', 'high', 'critical'), concrete code evidence, and 'matched_by' rule IDs.
    3. Provide actionable 'security_recommendations' and specify 'highest_risk'.
    4. Formulate 'inline_security_comments' with exact file path, line number, and secure replacement code for each flaw.
    PR content: \n{file_content}
    Security Pattern Findings: \n{sast_context}
  expected_output: >
    A JSON object containing:
    - 'security_vulnerabilities': An array of objects each with 'description', 'risk_level', 'evidence', and 'matched_by' (array of strings).
    - 'blocking': A boolean indicating whether any security vulnerability is severe enough to block approval.
    - 'highest_risk': A string representing the most severe risk level found ('low', 'medium', 'high', 'critical', or 'none').
    - 'security_recommendations': An array of actionable remediation steps.
    - 'inline_security_comments': An array of objects with 'path', 'line', 'severity', 'comment_body', and 'suggestion_code'.

summarize_findings:
  name: Summarize Findings
  agent: tech_lead
  description: >
    1. Synthesize the findings from Code Quality, Security Analysis, and Project Governance rules: \n{rules_context}
    IMPORTANT: Every claim in 'findings', 'recommendations', and 'inline_comments' MUST trace back to a specific item in the Code Quality output or Security Analysis output provided in context. Do not introduce new issues, vulnerability categories, or risk types that were not identified by analyze_code_quality or review_security. If you believe something was missed, do not include it — flag it separately under a new 'coverage_gaps' field instead of stating it as a finding.
    'findings' and 'inline_comments' MUST include content sourced from BOTH analyze_code_quality and review_security — do not let one context input dominate. If analyze_code_quality reported zero critical_issues and zero minor_issues, state that explicitly in 'findings' rather than omitting code-quality coverage entirely.
    2. Calculate 'confidence' using this explicit rubric, not free judgment:
       - Start at 100.
       - Subtract 30 for each 'critical' risk_level vulnerability in security_vulnerabilities that remains unresolved.
       - Subtract 15 for each 'high' risk_level vulnerability.
       - Subtract 10 for each critical_issue from analyze_code_quality.
       - Subtract 5 for each minor_issue or 'medium'/'low' vulnerability.
       - Floor at 0.
       Show the arithmetic that produced the final number as a string in a new 'confidence_breakdown' field.
    3. Consolidate a unified list of prioritized 'fix' items with clear technical solutions.
    4. Assemble a consolidated list of 'inline_comments' with exact file path, line number, side ('RIGHT' or 'LEFT'), severity ('CRITICAL', 'WARNING', 'INFO'), a terse technical 'comment_body', a 1-sentence plain-English 'why' explanation describing the causal mechanism (e.g. "user input reaches the query string unescaped, so a crafted id can run arbitrary SQL"), and 1-click replacement 'suggestion_code'.
    5. Provide 'suggested_unit_tests' containing a complete pytest test suite. Tests must assert the CURRENT, ACTUAL behavior of the code as given in {file_content} — including current bugs (e.g. if a function raises an exception today, assert that it raises, using pytest.raises; do not assert a hypothetical post-fix behavior). Where a test is meant to validate a proposed fix rather than current behavior, prefix its docstring with "POST-FIX:" and do not mix these with tests of current behavior in the same function.
  expected_output: >
    A JSON object containing:
    - 'confidence': An integer score between 0 and 100 representing confidence for merging.
    - 'confidence_breakdown': A string explaining the exact arithmetic calculation of the confidence score.
    - 'findings': A comprehensive summary string synthesizing code quality, security, and rule checks.
    - 'coverage_gaps': An array of strings describing potential gaps or areas not covered by upstream analysis.
    - 'fix': A list of objects containing 'description', 'solutions', and 'explanation' for each required fix.
    - 'recommendations': A list of strings containing additional recommendations or best practices.
    - 'inline_comments': A list of objects each with 'path', 'line', 'side', 'severity', 'comment_body', 'why', and 'suggestion_code'.
    - 'suggested_unit_tests': A string containing a complete pytest test suite for the modified functions.

  context:
    - analyze_code_quality
    - review_security
