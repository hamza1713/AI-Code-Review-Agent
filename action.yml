name: 'AI Code Review Agent'
description: 'Advisory multi-agent PR review service with human merge authority: deterministic static analysis plus native LLM providers'
author: 'Hamza Ali'

# Required GitHub Workflow Permissions:
# permissions:
#   contents: read
#   pull-requests: write
#   security-events: write

inputs:
  gemini_api_key:
    description: 'Google Gemini API Key'
    required: true
  github_token:
    description: 'GitHub Token for posting PR reviews and inline comments'
    required: true
    default: ${{ github.token }}
  llm_model:
    description: 'Gemini LLM model identifier'
    required: false
    default: 'gemini/gemini-3.1-flash-lite-preview'
  sarif_output:
    description: 'File path to save the SARIF report'
    required: false
    default: 'code-review-results.sarif'
  sarif_category:
    description: 'Code Scanning category for the uploaded SARIF report'
    required: false
    default: 'ai-code-review-agent'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a269eb4448574345517a6c986eb71b123bb0d034 # v5.4.0
      with:
        python-version: '3.11'

    - name: Install Review Agent Dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        # Install the action's own package with its dependencies. (`--no-deps`
        # succeeded without FastAPI/httpx/pydantic, so the review crashed on
        # import and never wrote the SARIF report.)
        pip install "${ACTION_PATH}"

    - name: Run AI Code Review Flow
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        LLM_MODEL: ${{ inputs.llm_model }}
        SARIF_OUTPUT: ${{ inputs.sarif_output }}
        REPO_NAME: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        python -m code_review_agent.main \
          --pr "${REPO_NAME}/pull/${PR_NUMBER}" \
          --sarif "${SARIF_OUTPUT}"

    - name: Upload SARIF Security Report
      # Only upload a report that exists, so a failed review shows its own error
      # instead of a misleading "Path does not exist" from the upload step.
      if: always() && hashFiles(inputs.sarif_output) != ''
      uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
      with:
        sarif_file: ${{ inputs.sarif_output }}
        category: ${{ inputs.sarif_category }}
